name: monthly lcsh check
on:
  schedule:
    - cron: '5 9 17 * *'
permissions: {}
env:
  GH_REPO: ${{ github.repository }}
  ASSIGNEES: charlottekostelic

jobs:
  monthly-run:
    name: Run monthly LCSH check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and set python version
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 #v10.3.3
        with:
          python-version: 3.14

      - name: Get date var
        run: |
          echo "DATE=$(date "+%Y-%m-%d")" >> $GITHUB_ENV

      - name: Run script
        run: |
          uv run monthly_lcsh_check.py

      - name: Parse output, create issue text
        run: |
          echo "CHANGED=$(grep -Eq "$DATE .+DEBUG" lcsh.log && echo 'true' || echo 'false')" >> $GITHUB_ENV
          REVISED_LIST=$(grep -E "$DATE .+DEBUG - Revised" lcsh.log | grep -Eo "\[.+]$" || echo 'false')
          DEPRECATED_LIST=$(grep -E "$DATE .+DEBUG - Deprecated" lcsh.log | grep -Eo "\[.+]$" || echo 'false')
          {
            echo "ISSUE_BODY<<EOF"
            if grep -Eq "$DATE .+DEBUG - Revised" lcsh.log; then
              echo "### Changed:"
              echo "$REVISED_LIST"
            fi
            if grep -Eq "$DATE .+DEBUG - Deprecated" lcsh.log; then
              echo "### Deprecated:"
              echo "$DEPRECATED_LIST"
            fi
            echo "EOF"
          } >> $GITHUB_ENV

      - name: Create Issue
        if: ${{ env.CHANGED == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${ISSUE_BODY}"
          gh issue create \
            --title "Changes to ACC LCSH ($DATE)" \
            --assignee "$ASSIGNEES" \
            --body "$ISSUE_BODY"